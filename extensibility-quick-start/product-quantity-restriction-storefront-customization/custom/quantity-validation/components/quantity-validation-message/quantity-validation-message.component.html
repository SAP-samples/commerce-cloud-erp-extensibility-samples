<div class="quantity-validation-error" role="alert" aria-live="polite">
  <span class="error-icon" aria-hidden="true">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="currentColor"
      aria-hidden="true"
    >
      <path d="M8 0a8 8 0 1 0 8 8 8 8 0 0 0-8-8zm1 12H7V7h2zm0-6H7V4h2z" />
    </svg>
  </span>
  <span class="error-message">{{
    'quantityValidation.maxQuantityMessage'
      | cxTranslate: { maxQuantity: maxQuantity() }
  }}</span>
</div>
